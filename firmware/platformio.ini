; neurband firmware - ESP32-S3-MINI-1-N8 (8 MB quad flash, no PSRAM)
; Build:  pio run          Flash: pio run -t upload      Monitor: pio device monitor

[env:neurband]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-MINI-1-N8: 8 MB QIO flash, no PSRAM
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_8MB.csv

; Native USB through the USB-Serial/JTAG peripheral (GPIO19/20):
; Serial == USB CDC from boot, flashing works without touching BOOT/EN.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

upload_speed = 921600
monitor_speed = 115200

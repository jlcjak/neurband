# neurband rev C. Works on upstream Zephyr (>= 3.7) and nRF Connect SDK (>= 2.7).

# ---- drivers / kernel
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_I2C=y
# LSM6DSL is driven by src/imu.c; keep Zephyr's sensor driver from claiming it
CONFIG_LSM6DSL=n
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

# ---- console/log over SEGGER RTT through the SWD probe. The board has no UART and the DK's
# UART pins (P0.06/P0.08) are SPI here.
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# ---- clocks: no 32.768 kHz crystal on the board -> calibrated LFRC (+-500 ppm sleep clock)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# ---- Bluetooth LE peripheral, high throughput (docs/firmware_c.md "Throughput budget")
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="neurband"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CONN_TX_MAX=8
# connection interval 7.5-15 ms (units of 1.25 ms), no latency, 4 s supervision timeout
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

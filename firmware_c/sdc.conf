# nRF Connect SDK only (added by CMakeLists.txt when the SoftDevice Controller is present).
# More LL TX buffers and long connection events let several 251-byte PDUs go out per event.
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=10
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=3
CONFIG_BT_CTLR_SDC_MAX_CONN_EVENT_LEN_DEFAULT=7500
CONFIG_BT_CTLR_SDC_CONN_EVENT_EXTEND_DEFAULT=y

# Only for Zephyr 3.7 / NCS 2.x (added by CMakeLists.txt). Newer versions use devicetree for this.
# Rev C has no DCC inductor: DC/DC must stay off (the nrf52dk board enables it by default).
CONFIG_BOARD_ENABLE_DCDC=n
# SPIM (EasyDMA) on nRF52832. The driver never issues 1-byte transfers (PAN 58), see ads1298.c.
CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=y
